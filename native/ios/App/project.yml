name: AlgerMusicMinimal
options:
  bundleIdPrefix: com.alger.music
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16"
  groupSortPosition: top

packages:
  AlgerIOS:
    path: ../

settings:
  base:
    # 签名团队：**MFMGY838LG**（JI DING）。
    # - Xcode 当前登录的账号属于该付费团队（isFreeProvisioningTeam=0）；
    # - 钥匙串里已有该团队的 "Apple Distribution" 证书；
    # - 9SVGN86A32（组织团队）在本机 Xcode **没有账号**，用它会报
    #   "No Account for Team" / "No Team Found in Archive"。
    DEVELOPMENT_TEAM: MFMGY838LG
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "5.2.0"
    MARKETING_VERSION: "5.2.0"

targets:
  AlgerMusicMinimal:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/AlgerApp
      - path: Assets.xcassets
    dependencies:
      - package: AlgerIOS
        product: AlgerKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 网易音乐
        # **版本号必须引用构建变量**：Info.plist 是静态文件，写死会让
        # xcodebuild 的 CURRENT_PROJECT_VERSION 覆盖失效（TestFlight 构建号
        # 会被判重复）。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # 后台播放（妈妈版的核心体验：锁屏也能听）
        UIBackgroundModes:
          - audio
        # 下载目录在 Documents/Downloads → 「文件」App 里能看到
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 第三方音源可能是 http（自用版再收紧）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alger.music.ios.minimal
        CODE_SIGN_STYLE: Automatic
        # **不写死签名身份**：xcodegen 默认写 "iPhone Developer"
        # （= Apple Development），会让归档匹配到**开发**描述文件，导出
        # App Store 时报 "No profiles for ... (iOS App Store)"；留空则由
        # Xcode 按动作自动选（Archive → Apple Distribution + App Store 描述文件）。
        # 手动写 "Apple Distribution" 也会报 "conflicting provisioning settings"。
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "5.2.0"
        # 构建号默认 1；TestFlight 构建由脚本用 CURRENT_PROJECT_VERSION=… 覆盖
        #（App Store Connect 要求构建号递增）。
        CURRENT_PROJECT_VERSION: "1"
